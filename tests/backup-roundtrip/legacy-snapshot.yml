# =============================================================================
# CS-IAM backup round trip - a snapshot of the zitadel-postgres source
# =============================================================================
# The previous release's compose files of the job
# "Backup Round Trip (legacy snapshot)" in .github/workflows/docker-release.yml
# (upgrade-from-compose-files), merged over docker-compose.development.yml.
#
# CS-IAM 0.17.29 to 0.17.31 backed up the Zitadel database with the source type
# zitadel-postgres, a plugin of their database-backup image. The job starts the
# sidecar as the 0.17.29 image (upgrade-from) and this file gives it
# ROUNDTRIP_SOURCE_TYPE as its database source, so the round trip's snapshot is
# one of theirs. At the upgrade the module switches the sidecar to the image
# built from this commit and the stack to docker-compose.development.yml alone
# - the source type the compose files ship - and the restore runs there.
# =============================================================================
services:
  database-backup:
    environment:
      # The engine's discrete override of jobs[0].sources[0].type, the Zitadel
      # database source in BACKUP_CONFIG_JSON. Everything else is the
      # development compose file's configuration.
      BACKUP_JOBS__0__SOURCES__0__TYPE: ${ROUNDTRIP_SOURCE_TYPE:?set by the legacy snapshot round trip}
