# CS-IAM plugin for the BackupHelper engine, installed into the database-backup
# image. The engine discovers the source through its entry point; the engine
# itself is the base image, so it is not a dependency here.

[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "cs-iam-backup"
version = "1.0.0"
description = "CS-IAM BackupHelper plugin: the Zitadel database source with a partition-safe restore"
requires-python = ">=3.12"
license = "MIT"

[project.optional-dependencies]
test = ["pytest>=8"]

[project.entry-points."backuphelper.sources"]
zitadel-postgres = "iam_backup.zitadel_postgres:ZitadelPostgresSource"

[tool.setuptools]
packages = ["iam_backup"]

[tool.pytest.ini_options]
testpaths = ["tests"]
