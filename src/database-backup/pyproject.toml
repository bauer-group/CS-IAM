# CS-IAM additions to the BackupHelper engine, installed into the
# database-backup image. No code of its own: one entry point, the alias below.
# The engine itself is the base image, so it is not a dependency here.

[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "cs-iam-backup"
version = "2.0.0"
description = "CS-IAM BackupHelper plugin: zitadel-postgres, an alias of the engine's postgres source"
requires-python = ">=3.12"
license = "MIT"

[project.optional-dependencies]
test = ["pytest>=8"]

# CS-IAM 0.17.29 to 0.17.31 backed up the Zitadel database with the source
# type `zitadel-postgres`, a plugin with its own restore for Zitadel's
# partitioned tables. The engine's `postgres` source restores them since
# BackupHelper 1.9.0, and the compose files use it again. The old name stays
# registered - as the engine's postgres source - so a compose file that still
# names it keeps backing up and restoring.
[project.entry-points."backuphelper.sources"]
zitadel-postgres = "backuphelper.sources.postgres:PostgresSource"

[tool.setuptools]
packages = []

[tool.pytest.ini_options]
testpaths = ["tests"]
