# =============================================================================
# Docker Maintenance — Auto-merge Dependabot PRs
# =============================================================================
# Decides every Dependabot PR (docker, pip, terraform, github-actions): no
# paths filter, so each one gets a merge or a visible "left open" notice.
#
# Merged only after docker-release.yml passed on the PR head. Its PR run
# watches src/** and terraform/**: it builds all images (directory-sync
# installs requirements*.txt and runs pytest), validates OpenTofu and runs the
# backup round trip, whose provisioner applies ./terraform against Zitadel.
# GitHub Actions updates and any .github/ change stay open (module guard).
#
# The merge is made with GITHUB_TOKEN and starts no push run, so the module
# dispatches docker-release.yml on main after a merge and waits for it: the
# run tests the merged commit again (validation, all backup round trips),
# releases exactly that commit and only then pushes the images. A release
# run that does not succeed turns this job red.
# =============================================================================

name: 🔧 Docker Maintenance

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]

permissions:
  contents: write       # merge
  pull-requests: write  # approve, read the PR
  checks: read          # check runs and suites - needed once the repo is private
  statuses: read        # commit statuses - needed once the repo is private
  actions: write        # dispatch the release; read workflow runs

jobs:
  maintenance:
    name: Auto-merge Dependabot PRs
    uses: bauer-group/automation-templates/.github/workflows/docker-maintenance-dependabot.yml@main
    with:
      merge-method: 'squash'
      auto-approve: true
      # Merge only after this PR CI has passed on the PR head commit - it
      # builds the images and runs the backup round trip.
      required-workflows: '.github/workflows/docker-release.yml'
      # Released after the merge: dispatched on main, awaited, a failed
      # release fails this job.
      release-workflow: '.github/workflows/docker-release.yml'
    secrets: inherit
