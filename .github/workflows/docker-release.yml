name: 🚀 Release & Docker Build

on:
  push:
    branches: [main]
    paths-ignore:
      - '.github/**'
      - '*.md'
      - 'docs/**'
  pull_request:
    branches: [main]
    paths:
      - 'src/**'
      - 'terraform/**'
      - 'config/**'
      - 'docker-compose*.yml'
      - '.dockerignore'
      - '.env.example'
      - 'scripts/generate-env.py'
      - 'tests/backup-roundtrip/**'
      - '.github/workflows/docker-release.yml'
  workflow_dispatch:
    inputs:
      force-release:
        description: 'force create release'
        type: boolean
        default: false

permissions:
  contents: write
  issues: write
  pull-requests: write
  packages: write
  security-events: write
  # Required by docker-build.yml@main: a declared permissions: block sets every
  # unlisted scope to none, and the reusable workflow now needs these three.
  attestations: write   # write the build-provenance attestation
  id-token: write       # OIDC token to sign the attestation (keyless/Sigstore)
  actions: read         # its nested security-analysis job reads run metadata

jobs:
  # ============================================
  # Validation
  # ============================================
  validate-compose:
    name: 🔍 Validate Docker Compose
    uses: bauer-group/automation-templates/.github/workflows/modules-validate-compose.yml@main
    with:
      compose-files: '["docker-compose.development.yml", "docker-compose.traefik.yml", "docker-compose.coolify.yml"]'
      env-file: '.env.example'
      validate-services: '["database-server", "zitadel", "provisioner", "directory-sync"]'

  validate-scripts:
    name: 🔍 Validate Shell Scripts
    uses: bauer-group/automation-templates/.github/workflows/modules-validate-shellscript.yml@main
    with:
      scan-directory: '.'
      severity: 'error'

  validate-terraform:
    name: 🔍 Validate OpenTofu
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: opentofu/setup-opentofu@v2
        with:
          tofu_version: '1.12.0'
      - name: tofu fmt
        working-directory: terraform
        run: tofu fmt -check -recursive
      - name: tofu validate
        working-directory: terraform
        run: |
          tofu init -backend=false -input=false
          tofu validate -no-color

  # ============================================
  # Backup round trip (gates every release)
  # ============================================
  # Builds every image from this commit, starts the development stack with the
  # backup profile, writes a marker user through the Zitadel API and a marker
  # row, backs up the database, deletes both, restores the snapshot and checks
  # that Zitadel has them back. Every release rebuilds the images FROM the
  # newest Zitadel, login and BackupHelper bases - also the one the base image
  # monitor dispatches - so this runs on every push, dispatch and relevant PR.
  # Docs-only pushes never reach it (paths-ignore).
  backup-roundtrip:
    name: 🧪 Backup Round Trip
    needs: [validate-compose, validate-scripts, validate-terraform]
    permissions:
      contents: read
      packages: read
    uses: bauer-group/automation-templates/.github/workflows/modules-backup-roundtrip-test.yml@main
    with:
      compose-file: 'docker-compose.development.yml'
      profiles: 'backup'
      # The stack's own generator: the masterkey must be exactly 32 characters,
      # the passwords must satisfy Zitadel's complexity policy.
      prepare-script: 'tests/backup-roundtrip/prepare.sh'
      # A GitHub-hosted runner, not a production host: CI-sized PostgreSQL
      # memory and a recognisable stack name.
      env-overrides: |
        STACK_NAME=iam_roundtrip
        PG_SHARED_BUFFERS=256MB
        PG_EFFECTIVE_CACHE_SIZE=1GB
        PG_MAINTENANCE_WORK_MEM=64MB
      # zitadel-brand runs the directory-sync image.
      build-images: |
        [
          {"service": "zitadel", "context": ".", "dockerfile": "src/zitadel/Dockerfile"},
          {"service": "login", "context": "src/login"},
          {"service": "provisioner", "context": ".", "dockerfile": "src/provisioner/Dockerfile"},
          {"service": "directory-sync", "context": "src/directory-sync"},
          {"service": "database-backup", "context": "src/database-backup"}
        ]
      backup-service: 'database-backup'
      # The only source: the Zitadel database (component named after it).
      require-components: 'zitadel'
      # zitadel is the only client of the database.
      services-to-stop-before-restore: 'zitadel'
      seed-script: 'tests/backup-roundtrip/seed.sh'
      mutate-script: 'tests/backup-roundtrip/mutate.sh'
      check-script: 'tests/backup-roundtrip/check.sh'
      timeout-minutes: 30
    secrets: inherit

  # ============================================
  # Release (only on main push / dispatch)
  # ============================================
  release:
    name: 📦 Create Semantic Release
    needs: [validate-compose, validate-scripts, validate-terraform, backup-roundtrip]
    if: |
      (github.event_name == 'push' || github.event_name == 'workflow_dispatch') &&
      needs.validate-compose.result == 'success' &&
      needs.validate-scripts.result == 'success' &&
      needs.validate-terraform.result == 'success' &&
      needs.backup-roundtrip.result == 'success'
    uses: bauer-group/automation-templates/.github/workflows/modules-semantic-release.yml@main
    with:
      target-branch: 'main'
      dry-run: false
      force-release: ${{ inputs.force-release || false }}
    secrets: inherit

  # ============================================
  # zitadel (wrapper of upstream + baked config; build-context = repo root)
  # ============================================
  docker-build-zitadel-release:
    name: 🐳 Build & Push zitadel
    needs: release
    if: needs.release.outputs.release-created == 'true'
    uses: bauer-group/automation-templates/.github/workflows/docker-build.yml@main
    with:
      deploy-environment: 'production'
      publish-to: 'ghcr'
      ghcr-image-name: 'bauer-group/CS-IAM/zitadel'
      docker-image-name: 'bauergroup/cs-iam-zitadel'
      release-version: ${{ needs.release.outputs.version }}
      image-tags: 'stable'
      update-dockerfile-version: true
      auto-tags: true
      latest-tag: true
      dockerfile-path: './src/zitadel/Dockerfile'
      docker-context: '.'
      platforms: 'linux/amd64'
      push: true
      generate-sbom: true
      sync-dockerhub-readme: true
      security-scan: false
      security-fail-on: 'CRITICAL'
    secrets: inherit

  docker-build-zitadel-pr:
    name: 🔨 Validate zitadel Build (PR)
    needs: [validate-compose, validate-scripts, validate-terraform]
    if: github.event_name == 'pull_request'
    uses: bauer-group/automation-templates/.github/workflows/docker-build.yml@main
    with:
      publish-to: 'ghcr'
      ghcr-image-name: 'bauer-group/CS-IAM/zitadel'
      auto-tags: true
      dockerfile-path: './src/zitadel/Dockerfile'
      docker-context: '.'
      platforms: 'linux/amd64'
      push: false
      security-scan: false
      security-fail-on: 'CRITICAL'
    secrets: inherit

  # ============================================
  # login (branding overlay; FROM the EP-Zitadel base login image)
  # ============================================
  docker-build-login-release:
    name: 🐳 Build & Push login
    needs: release
    if: needs.release.outputs.release-created == 'true'
    uses: bauer-group/automation-templates/.github/workflows/docker-build.yml@main
    with:
      deploy-environment: 'production'
      publish-to: 'ghcr'
      ghcr-image-name: 'bauer-group/CS-IAM/login'
      release-version: ${{ needs.release.outputs.version }}
      image-tags: 'stable'
      auto-tags: true
      latest-tag: true
      dockerfile-path: './src/login/Dockerfile'
      docker-context: './src/login'
      platforms: 'linux/amd64'
      push: true
      generate-sbom: true
      security-scan: false
      security-fail-on: 'CRITICAL'
    secrets: inherit

  docker-build-login-pr:
    name: 🔨 Validate login Build (PR)
    needs: [validate-compose, validate-scripts, validate-terraform]
    if: github.event_name == 'pull_request'
    uses: bauer-group/automation-templates/.github/workflows/docker-build.yml@main
    with:
      publish-to: 'ghcr'
      ghcr-image-name: 'bauer-group/CS-IAM/login'
      auto-tags: true
      dockerfile-path: './src/login/Dockerfile'
      docker-context: './src/login'
      platforms: 'linux/amd64'
      push: false
      security-scan: false
      security-fail-on: 'CRITICAL'
    secrets: inherit

  # ============================================
  # provisioner (OpenTofu IaC; build-context = repo root)
  # ============================================
  docker-build-provisioner-release:
    name: 🐳 Build & Push provisioner
    needs: release
    if: needs.release.outputs.release-created == 'true'
    uses: bauer-group/automation-templates/.github/workflows/docker-build.yml@main
    with:
      deploy-environment: 'production'
      publish-to: 'ghcr'
      ghcr-image-name: 'bauer-group/CS-IAM/provisioner'
      docker-image-name: 'bauergroup/cs-iam-provisioner'
      release-version: ${{ needs.release.outputs.version }}
      image-tags: 'stable'
      update-dockerfile-version: true
      auto-tags: true
      latest-tag: true
      dockerfile-path: './src/provisioner/Dockerfile'
      docker-context: '.'
      platforms: 'linux/amd64'
      push: true
      generate-sbom: true
      sync-dockerhub-readme: true
      security-scan: false
      security-fail-on: 'CRITICAL'
    secrets: inherit

  docker-build-provisioner-pr:
    name: 🔨 Validate provisioner Build (PR)
    needs: [validate-compose, validate-scripts, validate-terraform]
    if: github.event_name == 'pull_request'
    uses: bauer-group/automation-templates/.github/workflows/docker-build.yml@main
    with:
      publish-to: 'ghcr'
      ghcr-image-name: 'bauer-group/CS-IAM/provisioner'
      auto-tags: true
      dockerfile-path: './src/provisioner/Dockerfile'
      docker-context: '.'
      platforms: 'linux/amd64'
      push: false
      security-scan: false
      security-fail-on: 'CRITICAL'
    secrets: inherit

  # ============================================
  # directory-sync
  # ============================================
  docker-build-directory-sync-release:
    name: 🐳 Build & Push directory-sync
    needs: release
    if: needs.release.outputs.release-created == 'true'
    uses: bauer-group/automation-templates/.github/workflows/docker-build.yml@main
    with:
      deploy-environment: 'production'
      publish-to: 'ghcr'
      ghcr-image-name: 'bauer-group/CS-IAM/directory-sync'
      docker-image-name: 'bauergroup/cs-iam-directory-sync'
      release-version: ${{ needs.release.outputs.version }}
      image-tags: 'stable'
      update-dockerfile-version: true
      auto-tags: true
      latest-tag: true
      dockerfile-path: './src/directory-sync/Dockerfile'
      docker-context: './src/directory-sync'
      platforms: 'linux/amd64'
      push: true
      generate-sbom: true
      sync-dockerhub-readme: true
      security-scan: false
      security-fail-on: 'CRITICAL'
    secrets: inherit

  docker-build-directory-sync-pr:
    name: 🔨 Validate directory-sync Build (PR)
    needs: [validate-compose, validate-scripts, validate-terraform]
    if: github.event_name == 'pull_request'
    uses: bauer-group/automation-templates/.github/workflows/docker-build.yml@main
    with:
      publish-to: 'ghcr'
      ghcr-image-name: 'bauer-group/CS-IAM/directory-sync'
      auto-tags: true
      dockerfile-path: './src/directory-sync/Dockerfile'
      docker-context: './src/directory-sync'
      platforms: 'linux/amd64'
      push: false
      security-scan: false
      security-fail-on: 'CRITICAL'
    secrets: inherit

  # ============================================
  # database-backup
  # ============================================
  docker-build-database-backup-release:
    name: 🐳 Build & Push database-backup
    needs: release
    if: needs.release.outputs.release-created == 'true'
    uses: bauer-group/automation-templates/.github/workflows/docker-build.yml@main
    with:
      deploy-environment: 'production'
      publish-to: 'ghcr'
      ghcr-image-name: 'bauer-group/CS-IAM/database-backup'
      docker-image-name: 'bauergroup/cs-iam-database-backup'
      release-version: ${{ needs.release.outputs.version }}
      image-tags: 'stable'
      update-dockerfile-version: true
      auto-tags: true
      latest-tag: true
      dockerfile-path: './src/database-backup/Dockerfile'
      docker-context: './src/database-backup'
      platforms: 'linux/amd64'
      push: true
      generate-sbom: true
      sync-dockerhub-readme: true
      security-scan: false
      security-fail-on: 'CRITICAL'
    secrets: inherit

  docker-build-database-backup-pr:
    name: 🔨 Validate database-backup Build (PR)
    needs: [validate-compose, validate-scripts, validate-terraform]
    if: github.event_name == 'pull_request'
    uses: bauer-group/automation-templates/.github/workflows/docker-build.yml@main
    with:
      publish-to: 'ghcr'
      ghcr-image-name: 'bauer-group/CS-IAM/database-backup'
      auto-tags: true
      dockerfile-path: './src/database-backup/Dockerfile'
      docker-context: './src/database-backup'
      platforms: 'linux/amd64'
      push: false
      security-scan: false
      security-fail-on: 'CRITICAL'
    secrets: inherit
