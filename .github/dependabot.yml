# =============================================================================
# Dependabot Configuration
# =============================================================================
# Monitors GitHub Actions, Docker base images, Python deps and the OpenTofu
# provider for updates. Combined with docker-maintenance.yml for auto-merge,
# and with check-base-images.yml for digest-pinned upstream tracking.
#
# Commit prefixes decide whether a merged update is released (docker-
# maintenance.yml dispatches docker-release.yml after each merge):
#   fix(docker) / fix(deps)  runtime: base images, directory-sync's
#                            requirements, the provisioner's OpenTofu
#                            provider - PATCH release, images rebuilt
#   chore(deps-dev)          development dependencies - no release
#   chore(ci)                GitHub Actions - no release, merged by hand
# =============================================================================

version: 2
updates:
  # ── GitHub Actions ────────────────────────────────────────────────────────
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "sunday"
      time: "06:30"
      timezone: "Etc/UTC"
    labels:
      - "dependencies"
      - "github-actions"
      - "dependabot"
    commit-message:
      prefix: "chore(ci)"

  # ── Docker base images ────────────────────────────────────────────────────
  # zitadel application image (thin wrapper)
  - package-ecosystem: "docker"
    directory: "/src/zitadel"
    schedule:
      interval: "weekly"
      day: "sunday"
      time: "06:30"
      timezone: "Etc/UTC"
    labels:
      - "dependencies"
      - "docker"
      - "dependabot"
    commit-message:
      prefix: "fix(docker)"

  # provisioner (OpenTofu IaC runner)
  - package-ecosystem: "docker"
    directory: "/src/provisioner"
    schedule:
      interval: "weekly"
      day: "sunday"
      time: "06:30"
      timezone: "Etc/UTC"
    labels:
      - "dependencies"
      - "docker"
      - "dependabot"
    commit-message:
      prefix: "fix(docker)"

  # directory-sync (Entra -> Zitadel sidecar)
  - package-ecosystem: "docker"
    directory: "/src/directory-sync"
    schedule:
      interval: "weekly"
      day: "sunday"
      time: "06:30"
      timezone: "Etc/UTC"
    labels:
      - "dependencies"
      - "docker"
      - "dependabot"
    commit-message:
      prefix: "fix(docker)"

  # database-backup (pg_dump sidecar)
  - package-ecosystem: "docker"
    directory: "/src/database-backup"
    schedule:
      interval: "weekly"
      day: "sunday"
      time: "06:30"
      timezone: "Etc/UTC"
    labels:
      - "dependencies"
      - "docker"
      - "dependabot"
    commit-message:
      prefix: "fix(docker)"

  # ── Python dependencies ───────────────────────────────────────────────────
  - package-ecosystem: "pip"
    directory: "/src/directory-sync"
    # Only open a PR when the requirement actually blocks the new version
    # (no floor-raise noise for releases already allowed by the range).
    versioning-strategy: increase-if-necessary
    schedule:
      interval: "weekly"
      day: "sunday"
      time: "06:30"
      timezone: "Etc/UTC"
    labels:
      - "dependencies"
      - "python"
      - "dependabot"
    # requirements.txt is installed into the directory-sync image: a merged
    # update has to be released. prefix-development covers what Dependabot
    # classifies as development dependencies.
    commit-message:
      prefix: "fix(deps)"
      prefix-development: "chore(deps-dev)"

  # ── Terraform / OpenTofu provider ─────────────────────────────────────────
  - package-ecosystem: "terraform"
    directory: "/terraform"
    schedule:
      interval: "weekly"
      day: "sunday"
      time: "06:30"
      timezone: "Etc/UTC"
    labels:
      - "dependencies"
      - "terraform"
      - "dependabot"
    # ./terraform is baked into the provisioner image (COPY terraform/), so a
    # provider update changes a shipped image and has to be released.
    commit-message:
      prefix: "fix(deps)"
