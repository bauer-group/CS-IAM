# =============================================================================
# Dependabot Configuration
# =============================================================================
# Monitors GitHub Actions, Docker base images, Python deps and the OpenTofu
# provider for updates. Combined with docker-maintenance.yml for auto-merge,
# and with check-base-images.yml for digest-pinned upstream tracking.
#
# The commit prefix decides whether a merged update is released: fix(...)
# cuts a PATCH release and rebuilds the images, chore(...) releases nothing.
# Everything that ends up in a shipped image uses fix(...):
#   docker          -> fix(docker): the base images of zitadel, provisioner,
#                      directory-sync and database-backup
#   pip             -> fix(deps): directory-sync installs requirements.txt
#                      (prefix-development: chore(deps-dev) for what
#                      Dependabot counts as dev)
#   terraform       -> fix(deps): the provisioner image COPYs terraform/
#   github-actions  -> chore(ci): no release, never auto-merged
# =============================================================================

version: 2
updates:
  # ── GitHub Actions ────────────────────────────────────────────────────────
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "sunday"
      time: "14:40"
      timezone: "Etc/UTC"
    labels:
      - "dependencies"
      - "github-actions"
      - "dependabot"
    commit-message:
      prefix: "chore(ci)"

  # ── Docker base images ────────────────────────────────────────────────────
  # zitadel application image (thin wrapper)
  - package-ecosystem: "docker"
    directory: "/src/zitadel"
    schedule:
      interval: "weekly"
      day: "sunday"
      time: "14:40"
      timezone: "Etc/UTC"
    labels:
      - "dependencies"
      - "docker"
      - "dependabot"
    commit-message:
      prefix: "fix(docker)"

  # provisioner (OpenTofu IaC runner)
  - package-ecosystem: "docker"
    directory: "/src/provisioner"
    schedule:
      interval: "weekly"
      day: "sunday"
      time: "14:40"
      timezone: "Etc/UTC"
    labels:
      - "dependencies"
      - "docker"
      - "dependabot"
    commit-message:
      prefix: "fix(docker)"

  # directory-sync (Entra -> Zitadel sidecar)
  - package-ecosystem: "docker"
    directory: "/src/directory-sync"
    schedule:
      interval: "weekly"
      day: "sunday"
      time: "14:40"
      timezone: "Etc/UTC"
    labels:
      - "dependencies"
      - "docker"
      - "dependabot"
    commit-message:
      prefix: "fix(docker)"

  # database-backup (pg_dump sidecar)
  - package-ecosystem: "docker"
    directory: "/src/database-backup"
    schedule:
      interval: "weekly"
      day: "sunday"
      time: "14:40"
      timezone: "Etc/UTC"
    labels:
      - "dependencies"
      - "docker"
      - "dependabot"
    commit-message:
      prefix: "fix(docker)"

  # ── Python dependencies ───────────────────────────────────────────────────
  - package-ecosystem: "pip"
    directory: "/src/directory-sync"
    # Only open a PR when the requirement actually blocks the new version
    # (no floor-raise noise for releases already allowed by the range).
    versioning-strategy: increase-if-necessary
    schedule:
      interval: "weekly"
      day: "sunday"
      time: "14:40"
      timezone: "Etc/UTC"
    labels:
      - "dependencies"
      - "python"
      - "dependabot"
    commit-message:
      prefix: "fix(deps)"
      prefix-development: "chore(deps-dev)"

  # ── Terraform / OpenTofu provider ─────────────────────────────────────────
  - package-ecosystem: "terraform"
    directory: "/terraform"
    schedule:
      interval: "weekly"
      day: "sunday"
      time: "14:40"
      timezone: "Etc/UTC"
    labels:
      - "dependencies"
      - "terraform"
      - "dependabot"
    commit-message:
      prefix: "fix(deps)"
